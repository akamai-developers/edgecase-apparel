# K8s clusters
lkeClusters:
  primary:  # primary (parent) cluster
    controlPlane:
      auditLogs: true
      highAvailability: true
    k8sVersion: "1.35"
    label: edgecase-apparel-main
    region: us-mia
    tags:
      - ec-apparel
      - prod
