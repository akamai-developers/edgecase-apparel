# Edgecase Apparel config file

# K8s node pools
nodePools:
  apl:
    autoscaler:
      min: 3
      max: 15
    count: 3
    k8sVersion: "1.35"
    label: ec-app-platform
    labels:
      - key: "edgecase-apparel.io/apl"
        value: "true"
    tags:
      - apl
      - ec-apparel
    type: g7-dedicated-16-8
